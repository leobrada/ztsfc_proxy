<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="1550" viewBox="0 0 1100 1550">
  <defs>
    <style>
      .box { fill: #ffffff; stroke: #1c2b36; stroke-width: 1.5; rx: 8; }
      .title { font: 600 14px Arial, sans-serif; fill: #1c2b36; }
      .label { font: 12px Arial, sans-serif; fill: #1c2b36; }
      .file { font: 11px Arial, sans-serif; fill: #3b4a56; }
      .step { font: 600 12px Arial, sans-serif; fill: #1c2b36; }
      .lane { fill: #f5f7fa; stroke: #d2d9e1; stroke-width: 1; rx: 10; }
      .lane-title { font: 600 13px Arial, sans-serif; fill: #1c2b36; }
      .arrow { stroke: #1c2b36; stroke-width: 1.5; marker-end: url(#arrow); }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#1c2b36" />
    </marker>
  </defs>

  <!-- Lanes -->
  <rect class="lane" x="30" y="30" width="1040" height="170" />
  <rect class="lane" x="30" y="210" width="1040" height="340" />
  <rect class="lane" x="30" y="560" width="1040" height="450" />
  <rect class="lane" x="30" y="1040" width="1040" height="470" />

  <text class="lane-title" x="50" y="55">Client</text>
  <text class="lane-title" x="50" y="235">Frontend TLS + HTTP Server</text>
  <text class="lane-title" x="50" y="585">PEP Routing + Proxy</text>
  <text class="lane-title" x="50" y="1065">Backend + Logging</text>

  <!-- Shared box dimensions -->
  <!-- x=190, width=720, height=90, center x=550 -->

  <!-- Step 1 -->
  <rect class="box" x="190" y="70" width="720" height="90" />
  <text class="step" x="210" y="95">1</text>
  <text class="title" x="550" y="100" text-anchor="middle">Client connects</text>
  <text class="label" x="550" y="122" text-anchor="middle">TLS handshake + HTTP</text>

  <!-- Step 2 -->
  <rect class="box" x="190" y="230" width="720" height="90" />
  <text class="step" x="210" y="255">2</text>
  <text class="title" x="550" y="260" text-anchor="middle">TLS handshake</text>
  <text class="label" x="550" y="282" text-anchor="middle">SNI selects cert, optional client mTLS</text>
  <text class="file" x="550" y="304" text-anchor="middle">internal/security/tlsutil/tlsutil.go</text>

  <!-- Step 3 -->
  <rect class="box" x="190" y="335" width="720" height="90" />
  <text class="step" x="210" y="360">3</text>
  <text class="title" x="550" y="365" text-anchor="middle">CRL validation</text>
  <text class="label" x="550" y="387" text-anchor="middle">CAs + CRL check, optional reload interval</text>
  <text class="file" x="550" y="409" text-anchor="middle">internal/security/tlsutil/tlsutil.go</text>

  <!-- Step 4 -->
  <rect class="box" x="190" y="440" width="720" height="90" />
  <text class="step" x="210" y="465">4</text>
  <text class="title" x="550" y="470" text-anchor="middle">HTTP request enters server</text>
  <text class="label" x="550" y="492" text-anchor="middle">Forwarded to PEP mux</text>
  <text class="file" x="550" y="514" text-anchor="middle">internal/frontend/frontend.go</text>

  <!-- Step 5 -->
  <rect class="box" x="190" y="590" width="720" height="90" />
  <text class="step" x="210" y="615">5</text>
  <text class="title" x="550" y="620" text-anchor="middle">PEP handler entry</text>
  <text class="label" x="550" y="642" text-anchor="middle">ServeHTTP</text>
  <text class="file" x="550" y="664" text-anchor="middle">internal/pep/pep.go</text>

  <!-- Step 6 -->
  <rect class="box" x="190" y="695" width="720" height="90" />
  <text class="step" x="210" y="720">6</text>
  <text class="title" x="550" y="725" text-anchor="middle">Service lookup</text>
  <text class="label" x="550" y="747" text-anchor="middle">SNI -> service_pool, 404 if missing</text>
  <text class="file" x="550" y="769" text-anchor="middle">internal/service/services.go</text>

  <!-- Step 7 -->
  <rect class="box" x="190" y="800" width="720" height="90" />
  <text class="step" x="210" y="825">7</text>
  <text class="title" x="550" y="830" text-anchor="middle">Reverse proxy setup</text>
  <text class="label" x="550" y="852" text-anchor="middle">Request hash + HSTS on response</text>
  <text class="file" x="550" y="874" text-anchor="middle">internal/pep/pep.go</text>

  <!-- Step 8 -->
  <rect class="box" x="190" y="905" width="720" height="90" />
  <text class="step" x="210" y="930">8</text>
  <text class="title" x="550" y="935" text-anchor="middle">Transport selection</text>
  <text class="label" x="550" y="957" text-anchor="middle">HTTP or HTTPS</text>
  <text class="file" x="550" y="979" text-anchor="middle">internal/pep/pep.go</text>

  <!-- Step 9 -->
  <rect class="box" x="190" y="1050" width="720" height="90" />
  <text class="step" x="210" y="1075">9</text>
  <text class="title" x="550" y="1080" text-anchor="middle">Backend service</text>
  <text class="label" x="550" y="1102" text-anchor="middle">Target URL</text>

  <!-- Step 10 -->
  <rect class="box" x="190" y="1165" width="720" height="90" />
  <text class="step" x="210" y="1190">10</text>
  <text class="title" x="550" y="1195" text-anchor="middle">Backend TLS (if HTTPS)</text>
  <text class="label" x="550" y="1217" text-anchor="middle">Client certs + CAs + CRL reload</text>
  <text class="file" x="550" y="1239" text-anchor="middle">internal/security/tlsutil/tlsutil.go</text>

  <!-- Step 11 -->
  <rect class="box" x="190" y="1280" width="720" height="90" />
  <text class="step" x="210" y="1305">11</text>
  <text class="title" x="550" y="1310" text-anchor="middle">Response to client</text>
  <text class="label" x="550" y="1332" text-anchor="middle">Via proxy</text>

  <!-- Step 12 -->
  <rect class="box" x="190" y="1395" width="720" height="90" />
  <text class="step" x="210" y="1420">12</text>
  <text class="title" x="550" y="1425" text-anchor="middle">Data plane logs</text>
  <text class="label" x="550" y="1447" text-anchor="middle">Forward + response, hash correlation</text>
  <text class="file" x="550" y="1469" text-anchor="middle">internal/logger/data_plane_logger.go</text>

  <!-- Arrows -->
  <line class="arrow" x1="550" y1="160" x2="550" y2="230" />
  <line class="arrow" x1="550" y1="320" x2="550" y2="335" />
  <line class="arrow" x1="550" y1="425" x2="550" y2="440" />
  <line class="arrow" x1="550" y1="530" x2="550" y2="590" />
  <line class="arrow" x1="550" y1="680" x2="550" y2="695" />
  <line class="arrow" x1="550" y1="785" x2="550" y2="800" />
  <line class="arrow" x1="550" y1="890" x2="550" y2="905" />
  <line class="arrow" x1="550" y1="995" x2="550" y2="1050" />
  <line class="arrow" x1="550" y1="1140" x2="550" y2="1165" />
  <line class="arrow" x1="550" y1="1255" x2="550" y2="1280" />
  <line class="arrow" x1="550" y1="1370" x2="550" y2="1395" />
</svg>
